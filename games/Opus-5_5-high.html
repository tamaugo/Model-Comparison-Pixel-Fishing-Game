'use strict';

/* =========================================================================
   LAKESIDE ANGLER
   A Stardew-style fishing game. Extra mechanic: DAY / NIGHT CYCLE.
   Time passes while you fish; every species only bites during certain
   hours, and the rarest fish only come out late at night.
   ========================================================================= */

// ---------------------------------------------------------------- constants
const W = 320, H = 180;
const WATER_Y = 80;          // first row of lake water

// ---------------------------------------------------------------- canvas

const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit);
fit();

function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}

// ---------------------------------------------------------------- helpers
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => a + Math.floor(Math.random() * (b - a));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const hex2 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const lighten = (h, t) => rgb(mix(hex2(h), [255, 255, 255], t));
const hash = (x, y) => { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); };

const [chkC, chkG] = mk(2, 2);
function checker(g, x, y, w, h, col) {        // 50% ordered dither
  chkG.clearRect(0, 0, 2, 2);
  chkG.fillStyle = col;
  chkG.fillRect(0, 0, 1, 1);
  chkG.fillRect(1, 1, 1, 1);
  g.fillStyle = g.createPattern(chkC, 'repeat');
  g.fillRect(x, y, w, h);
}
function disc(g, cx, cy, r) {                  // crisp pixel circle
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy));
    g.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
  }
}
function line(g, x0, y0, x1, y1, col, th = 1) {
  g.fillStyle = col;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
  const o = Math.floor((th - 1) / 2);
  for (let i = 0; i <= n; i++) {
    const u = n ? i / n : 0;
    g.fillRect(Math.round(x0 + (x1 - x0) * u) - o, Math.round(y0 + (y1 - y0) * u) - o, th, th);
  }
}

// ---------------------------------------------------------------- pixel font (3x5)
const FONT_SRC = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
  E:'111100110100111', F:'111100110100100', G:'011100101101011', H:'101101111101101',
  I:'111010010010111', J:'001001001101010', K:'101101110101101', L:'100100100100111',
  M:'101111111101101', N:'110101101101101', O:'010101101101010', P:'110101110100100',
  Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101',
  Y:'101101010010010', Z:'111001010100111',
  '0':'111101101101111', '1':'010110010010111', '2':'110001010100111', '3':'110001010001110',
  '4':'101101111001001', '5':'111100110001110', '6':'011100111101111', '7':'111001010010010',
  '8':'111101111101111', '9':'111101111001110',
  ' ':'000000000000000', '.':'000000000000010', ',':'000000000010100', ':':'000010000010000',
  '!':'010010010000010', '?':'110001010000010', '-':'000000111000000', '+':'000010111010000',
  '/':'001001010100100', '(':'001010010010001', ')':'100010010010100', "'":'010010000000000',
  '%':'101001010100101', '=':'000111000111000', '<':'001010100010001', '>':'100010001010100',
  '*':'000101010101000', '_':'000000000000111'
};
const FONT_CHARS = Object.keys(FONT_SRC).join('');
const charIndex = {};
[...FONT_CHARS].forEach((ch, i) => charIndex[ch] = i);
const fontCache = {};
function fontAtlas(color) {
  if (fontCache[color]) return fontCache[color];
  const [c, g] = mk(FONT_CHARS.length * 4, 5);
  g.fillStyle = color;
  for (let i = 0; i < FONT_CHARS.length; i++) {
    const s = FONT_SRC[FONT_CHARS[i]];
    for (let p = 0; p < 15; p++) if (s[p] === '1') g.fillRect(i * 4 + p % 3, (p / 3) | 0, 1, 1);
  }
  return (fontCache[color] = c);
}
function text(str, x, y, color = '#fff', scale = 1, shadow = null) {
  str = String(str).toUpperCase();
  if (shadow) text(str, x + scale, y + scale, shadow, scale, null);
  const at = fontAtlas(color);
  let cx = Math.round(x);
  y = Math.round(y);
  for (const ch of str) {
    const i = charIndex[ch];
    if (i !== undefined && ch !== ' ') ctx.drawImage(at, i * 4, 0, 3, 5, cx, y, 3 * scale, 5 * scale);
    cx += 4 * scale;
  }
}
const textW = (str, scale = 1) => String(str).length * 4 * scale - scale;
const textC = (str, cx, y, color, scale = 1, shadow = null) =>
  text(str, Math.round(cx - textW(str, scale) / 2), y, color, scale, shadow);

// ---------------------------------------------------------------- sprite builder
function spriteFromMap(rows, pal, outline) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const [c, g] = mk(w + 2, h + 2);
  const filled = (i, j) => j >= 0 && j < h && i >= 0 && i < rows[j].length && rows[j][i] !== '.';
  if (outline) {
    g.fillStyle = outline;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (filled(i, j)) continue;
      if (filled(i - 1, j) || filled(i + 1, j) || filled(i, j - 1) || filled(i, j + 1)) g.fillRect(i + 1, j + 1, 1, 1);
    }
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < rows[j].length; i++) {
    const ch = rows[j][i];
    if (ch === '.') continue;
    g.fillStyle = pal[ch] || '#f0f';
    g.fillRect(i + 1, j + 1, 1, 1);
  }
  return c;
}
const swap = (rows, map) => rows.map(r => [...r].map(ch => map[ch] || ch).join(''));
const replaceRows = (rows, idx, newRows) => rows.map((r, i) => (i in newRows ? newRows[i] : r));

SPR.moon = spriteFromMap(['..mmm.', '.mmm..', 'mmm...', 'mmm...', 'mmm...', '.mmm..', '..mmm.'], { m: '#f0e8b0' }, '#5a3418');
const ICON_MAP = [

  'b.bbbbbbb.',
  'bbbbbbbkbb',

  'b.bblllll.',
  '....bb....',
];
SPR.hudFish = spriteFromMap(ICON_MAP, { b: '#4a90d8', l: '#a8d0f4', k: '#101018' }, '#3a2010');

// ---------------------------------------------------------------- fish data
const TIERS = [
  { name: 'EASY',      color: '#78e070', stars: 1 },
  { name: 'MEDIUM',    color: '#f4d848', stars: 2 },
  { name: 'HARD',      color: '#f49040', stars: 3 },

  { name: 'LEGENDARY', color: '#ffd700', stars: 5 },

// motion types follow Stardew's: mixed / dart / smooth / sinker / floater
const FISH = [
  { name: 'Sunfish', tier: 0, diff: 20, motion: 'mixed', time: [6, 19], weight: 30, pts: 20, size: [8, 20],

// procedural fish sprite generator (faces right)
function genFish(f) {
  const s = f.shape, C = f.col;
  const len = s.len, hgt = s.h, tail = s.tail;
  const GW = tail + len + 6, GH = hgt + 8;
  const g = [];
  for (let y = 0; y < GH; y++) g.push(new Array(GW).fill(null));
  const post = [];
  const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < GW && y < GH) g[y][x] = c; };
  const get = (x, y) => (x >= 0 && y >= 0 && x < GW && y < GH) ? g[y][x] : null;
  const cy = GH / 2, x0 = tail + 1, x1 = x0 + len - 1;
  const prof = u => {
    if (s.eel) { if (u < 0.12) return 0.55 + u * 3.75; if (u > 0.9) return 1 - (u - 0.9) * 4; return 1; }
    return Math.pow(Math.max(0.05, Math.sin(Math.PI * (0.08 + 0.84 * u))), s.blunt);
  };
  const hh = u => Math.max(0.6, (hgt / 2) * prof(u));

  // tail fin
  for (let i = 1; i <= tail; i++) {
    const x = x0 - i;
    const spread = Math.max(1, hgt * 0.16) + i * (hgt * 0.42 / tail) * (s.eel ? 0.4 : 1);
    for (let y = 0; y < GH; y++) {
      const dy = Math.abs(y + 0.5 - cy);
      if (dy <= spread) {
        if (s.fork && i > tail * 0.45 && dy < (i - tail * 0.45) * 0.95) continue;
        set(x, y, C.fin);
      }
    }
  }
  // body + patterns
  for (let x = x0; x <= x1; x++) {
    const u = (x - x0) / (len - 1), h = hh(u), xr = x - x0;
    for (let y = 0; y < GH; y++) {
      const dy = y + 0.5 - cy;
      if (Math.abs(dy) > h + 0.2) continue;
      const v = dy / h;
      let col = v < -0.4 ? C.back : v > 0.35 ? C.belly : C.main;
      switch (f.pattern) {
        case 'stripes': if (xr % 3 === 1 && v < 0.45 && u > 0.12 && u < 0.74) col = C.pat; break;
        case 'band': if (v > -0.3 && v < 0.2 && u < 0.8 && hash(x, y) < 0.75) col = C.pat; break;
        case 'trout':
          if (v > -0.2 && v < 0.25 && u < 0.82) col = C.pat;
          else if (v < -0.15 && hash(x, y) < 0.22) col = '#2a2a2a';
          break;
        case 'spots': if (v < 0.35 && v > -0.7 && u < 0.8 && hash(x, y) < 0.25) col = C.pat; break;
        case 'scales': if ((x + y) % 2 === 0 && v > -0.5 && v < 0.4 && u < 0.75) col = C.pat; break;
        case 'scutes': if (u < 0.85 && ((v < -0.5 && x % 2 === 0) || (Math.abs(v) < 0.2 && x % 3 === 0))) col = C.pat; break;
        case 'glow': if (Math.abs(v) < 0.35 && xr % 3 === 1 && u < 0.9) col = C.pat; break;
        case 'koi': if (hash(Math.floor(x / 3), Math.floor(y / 2) + 7) < 0.45 && v < 0.55 && u < 0.85) col = C.pat; break;
      }
      set(x, y, col);
    }
  }
  // gill line
  if (!s.eel) {
    const xg = x0 + Math.round(0.7 * (len - 1)), h = hh(0.7);
    for (let y = 0; y < GH; y++) {
      const v = (y + 0.5 - cy) / h;
      if (g[y][xg] && Math.abs(v) < 0.6) set(xg, y, C.back);
    }
  }
  // dorsal fin
  const [du0, du1] = s.dorsalU || (s.eel ? [0.12, 0.85] : [0.3, 0.62]);
  for (let x = x0; x <= x1; x++) {
    const u = (x - x0) / (len - 1);
    if (u < du0 || u > du1) continue;
    const t = (u - du0) / (du1 - du0);
    let yt = 0; while (yt < GH && !g[yt][x]) yt++;
    const fh = s.eel ? 1 : Math.max(1, Math.round(s.dorsal * (s.spiky ? (x % 2 ? 1 : 0.55) : (1 - t * 0.55))));
    for (let k = 1; k <= fh; k++) if (!get(x, yt - k)) set(x, yt - k, C.fin);
  }
  // belly fins
  const bottomOf = x => { let yb = GH - 1; while (yb > 0 && !g[yb][x]) yb--; return yb; };
  if (s.eel) {
    for (let x = x0 + Math.round(len * 0.12); x < x0 + Math.round(len * 0.6); x++) set(x, bottomOf(x) + 1, C.fin);
  } else {
    const xp = x0 + Math.round(0.5 * (len - 1)), yp = bottomOf(xp);
    set(xp, yp + 1, C.fin); set(xp - 1, yp + 1, C.fin); set(xp - 1, yp + 2, C.fin);
    const xa = x0 + Math.round(0.22 * (len - 1)), ya = bottomOf(xa);
    set(xa, ya + 1, C.fin); set(xa - 1, ya + 1, C.fin);
  }
  // crown for the king
  if (s.crown) {
    const xc = x0 + Math.round(0.66 * (len - 1));
    let yt = GH;
    for (let x = xc; x < xc + 5; x++) { let y = 0; while (y < GH && !g[y][x]) y++; yt = Math.min(yt, y); }
    for (let x = xc; x < xc + 5; x++) { set(x, yt - 1, '#ffe040'); set(x, yt - 2, x === xc + 2 ? '#e02040' : '#ffe040'); }
    set(xc, yt - 3, '#ffe040'); set(xc + 2, yt - 3, '#ffe040'); set(xc + 4, yt - 3, '#ffe040');
  }
  // eye & mouth
  const eu = s.eel ? 0.9 : 0.82;
  const ex = x0 + Math.round(eu * (len - 1)), ey = Math.floor(cy - hh(eu) * (s.eel ? 0.2 : 0.35));
  set(ex, ey, '#101018');
  if (hgt >= 6) set(ex - 1, ey, '#ffffff');
  const my = Math.round(cy + hh(1) * 0.25);
  set(x1, my, '#2a1a1a');
  if (s.bigmouth) { set(x1 - 1, my, '#2a1a1a'); set(x1 - 2, my, '#2a1a1a'); }
  if (s.whisk) {
    for (let k = 1; k <= 1 + s.whisk; k++) post.push([x1 + k, my + Math.floor(k * 0.7)]);
    if (s.whisk >= 2) for (let k = 1; k <= 2; k++) post.push([x1 + k - 1, my + k + 1]);
  }
  // outline pass
  const out = g.map(r => r.slice());
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    if (g[y][x]) continue;
    if (get(x - 1, y) || get(x + 1, y) || get(x, y - 1) || get(x, y + 1)) out[y][x] = C.out;
  }
  post.forEach(([x, y]) => { if (x >= 0 && y >= 0 && x < GW && y < GH) out[y][x] = '#2a2420'; });
  // trim + render
  let minx = GW, maxx = 0, miny = GH, maxy = 0;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (out[y][x]) {
    minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y);
  }
  const [c, cg] = mk(maxx - minx + 1, maxy - miny + 1);
  for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) if (out[y][x]) {
    cg.fillStyle = out[y][x];
    cg.fillRect(x - minx, y - miny, 1, 1);
  }

}

let AC = null, master = null, noiseBuf = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = 0.22;
    master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0, delay = 0) {
  if (!AC || G.muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1000, delay = 0) {
  if (!AC || G.muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.05);
}

function keyInterp(keys, h) {
  if (h <= keys[0][0]) return keys[0][1].slice();
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (h <= b[0]) { const t = (h - a[0]) / (b[0] - a[0]); return a[1].map((v, j) => v + (b[1][j] - v) * t); }
  }
  return keys[keys.length - 1][1].slice();
}

function pine(g, cx, base, h, cols, record) {
  g.fillStyle = '#4a3424';

  for (let k = 0; k < h; k++) {
    const y = base - h + k;
    const half = Math.floor(k * 0.4 + (k % 3) * 0.3);
    for (let dx = -half; dx <= half; dx++) {
      g.fillStyle = dx < 0 ? cols[0] : dx === 0 ? cols[1] : cols[2];
      g.fillRect(cx + dx, y, 1, 1);
      if (record && cx + dx >= 0 && cx + dx < W) treeTop[cx + dx] = Math.min(treeTop[cx + dx], y);

function makeCloud(w, h) {
  const [c, g] = mk(w, h);
  const circ = [];
  const n = Math.max(3, (w / 10) | 0);
  for (let i = 0; i < n; i++)
    circ.push([w * (0.15 + 0.7 * i / (n - 1)), h * 0.62 - (i % 2 ? h * 0.16 : 0) - (i === n >> 1 ? h * 0.14 : 0), h * (0.32 + ((i * 7) % 3) * 0.07)]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (y > h * 0.86) continue;
    let inside = false;
    for (const [cx, cy, r] of circ) if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) { inside = true; break; }
    if (!inside) continue;
    g.fillStyle = y > h * 0.66 ? '#d6e2f2' : '#ffffff';
    g.fillRect(x, y, 1, 1);
  }
  return c;
}

// ---------------------------------------------------------------- dog logic
function dogSay(text, dur = 70) { dog.bubble = { text, t: dur, max: dur }; }

function baseMood() {
  switch (G.state) {
    case 'casting': case 'waiting': return 'watch';
    case 'bite': return 'excited';
    case 'minigame': return 'cheer';
    default: return 'idle';
  }
}
function dogReact(ev) {
  switch (ev) {
    case 'cast': dog.mood = 'watch'; dog.moodT = 0; dog.sleeping = false; dog.face = 1; hop(1.6); break;
    case 'bite': dog.mood = 'excited'; dog.moodT = 70; dog.sleeping = false; dogSay('WOOF!', 50); SFX.bark(); hop(2.2); break;
    case 'reel': dog.mood = 'cheer'; dog.moodT = 0; break;
    case 'catch': dog.mood = 'happy'; dog.moodT = 200; dogSay('WOOF WOOF!', 80); SFX.bark(); hearts(4); break;
    case 'lost': dog.mood = 'sad'; dog.moodT = 170; dogSay('...', 100); break;
    case 'miss': dog.mood = 'sad'; dog.moodT = 100; dogSay('?', 70); break;
    case 'pet': dog.mood = 'pet'; dog.moodT = 100; dog.sleeping = false; dog.idleT = 0; hearts(3); dogSay('HEART', 55); break;
  }
}
function updateDog() {
  const d = dog;
  if (d.moodT > 0) { d.moodT--; if (d.moodT === 0) d.mood = baseMood(); }
  else d.mood = baseMood();
  if (d.bubble && --d.bubble.t <= 0) d.bubble = null;
  if (d.y < 0 || d.vy < 0) { d.vy += 0.3; d.y += d.vy; if (d.y >= 0) { d.y = 0; d.vy = 0; } }
  const ground = d.y === 0;
  if (d.mood === 'idle' && G.state !== 'title') {
    d.idleT++;
    if (isNight() && d.idleT > 360) d.sleeping = true;
  } else if (d.mood !== 'idle') { d.idleT = 0; d.sleeping = false; }
  switch (d.mood) {
    case 'happy':
      if (ground && Math.random() < 0.1) { d.vy = -2.6; if (Math.random() < 0.5) d.face *= -1; }
      if (G.t % 16 === 0) hearts(1);
      break;
    case 'cheer':
      d.face = 1;
      if (ground && Math.random() < 0.025) d.vy = -1.8;
      if (Math.random() < 0.004) { dogSay('ARF!', 35); SFX.bark(); }
      break;
    case 'excited': d.face = 1; if (ground && Math.random() < 0.09) d.vy = -1.6; break;
    case 'pet': d.face = 1; if (G.t % 20 === 0) hearts(1); break;
    case 'watch': case 'sad': d.face = 1; break;
    case 'idle':
      if (!d.sleeping && Math.random() < 0.002) d.face = -d.face;

}

// ---------------------------------------------------------------- fishing logic
function depthFactor(tier, d) {
  return [1.3 - 0.6 * d, 0.8 + 0.4 * d, 0.4 + 1.2 * d, 0.2 + 1.6 * d, 0.1 + 2.4 * d * d][tier];
}
function pickFish(depth) {
  const h = hour();
  let total = 0;
  const ws = FISH.map(f => {
    if (h < f.time[0] || h >= f.time[1]) return 0;
    const w = f.weight * depthFactor(f.tier, depth);
    total += w;
    return w;
  });
  let r = Math.random() * total;
  for (let i = 0; i < FISH.length; i++) { r -= ws[i]; if (r <= 0 && ws[i] > 0) return FISH[i]; }
  return FISH[1];
}

function doCast() {
  const b = G.bob, pw = G.power;
  b.depth = pw;
  b.sx = G.tip.x; b.sy = G.tip.y;
  b.tx = Math.round(136 + pw * 150);
  b.ty = Math.round(142 - pw * 46);
  b.x = b.sx; b.y = b.sy;
  b.t = 0; b.dur = Math.round(26 + pw * 18);
  b.vis = true; b.water = false; b.under = false; b.dip = 0;
  G.state = 'casting';
  SFX.cast();

  if (pw > 0.95) setMsg('MAX CAST! DEEP WATER...', '#c8f0ff', 70);
}
function land() {
  const b = G.bob;
  b.water = true; b.x = b.tx; b.y = b.ty;

}

  G.state = 'bite';
  G.biteWin = Math.round(60 - G.fish.tier * 6);

}
function hook() {

    pos: 508, target: -1, speed: 0, acc: 0, fsAcc: 0,

// Stardew-style bobber bar. Track is 568 units tall (drawn at 1/4 scale).
function updateMG() {
  const m = G.mg, b = G.bob;
  m.t++;
  b.x = m.bx + Math.sin(m.t * 0.07) * 3 + ((m.pos - 262) / 262) * 4;
  b.y = m.by + Math.cos(m.t * 0.05) * 1.5;
  if (m.t % 16 === 0) ripple(b.x, b.y, 7);
  if (m.t % 22 === 0) splash(b.x, b.y, 3, 0.7);
  if (m.delay > 0) { m.delay--; return; }

  // --- fish AI
  const d = m.diff, mt = m.motion;
  if (Math.random() < d * (mt !== 'smooth' ? 1 : 20) / 4000 && (mt !== 'smooth' || m.target === -1)) {
    const below = 548 - m.pos, above = m.pos;
    const pct = Math.min(99, d + randi(10, 45)) / 100;
    m.target = m.pos + randi(Math.min(-above, below), below) * pct;
  }
  if (mt === 'floater') m.fsAcc = Math.max(m.fsAcc - 0.01, -1.5);
  else if (mt === 'sinker') m.fsAcc = Math.min(m.fsAcc + 0.01, 1.5);
  if (Math.abs(m.pos - m.target) > 3 && m.target !== -1) {
    m.acc = (m.target - m.pos) / (randi(10, 30) + (100 - Math.min(100, d)));
    m.speed += (m.acc - m.speed) / 5;
  } else if (mt !== 'smooth' && Math.random() < d / 2000) {
    m.target = m.pos + (Math.random() < 0.5 ? randi(-100, -51) : randi(50, 101));
  } else {
    m.target = -1;
  }
  if (mt === 'dart' && Math.random() < d / 1000)
    m.target = m.pos + (Math.random() < 0.5 ? randi(-100 - d * 2, -51) : randi(50, 101 + d * 2));
  m.target = Math.max(-1, Math.min(m.target, 524));
  m.pos += m.speed + m.fsAcc;
  if (m.pos > 524) m.pos = 524; else if (m.pos < 0) m.pos = 0;

  // --- player bar
  m.inBar = m.pos + 16 >= m.barPos && m.pos + 44 <= m.barPos + m.barH;
  let gr = input.held ? -0.25 : 0.25;
  if (input.held && (m.barPos === 0 || m.barPos === 568 - m.barH)) m.barSpeed = 0;
  if (m.inBar) gr *= 0.6;
  m.barSpeed += gr;
  m.barPos += m.barSpeed;
  if (m.barPos + m.barH > 568) { m.barPos = 568 - m.barH; m.barSpeed = -m.barSpeed * 2 / 3; }
  else if (m.barPos < 0) { m.barPos = 0; m.barSpeed = -m.barSpeed * 2 / 3; }

  // --- catch meter
  if (m.inBar) { m.progress += 0.002; if (m.t % 7 === 0) SFX.reel(); }
  else { m.progress -= 0.003; m.perfect = false; if (m.t % 14 === 0) SFX.reelOut(); }

  if (m.progress >= 1) {
    m.progress = 1;
    G.state = 'landing';
    G.land = { t: 0, dur: 42, sx: b.x, sy: b.y, x: b.x, y: b.y, fish: m.fish, perfect: m.perfect };
    b.vis = false;
    splash(b.x, b.y, 14, 1.4);
    ripple(b.x, b.y, 12);
    SFX.splash();
    dogReact('catch');
  } else if (m.progress <= 0) {
    G.mg = null;
    reelIn();
    setMsg('THE FISH ESCAPED!', '#ff9a8a', 140);
    SFX.fail();
    dogReact('lost');
  }
}
function updateLanding() {
  const L = G.land;
  L.t++;
  const u = Math.min(1, L.t / L.dur);
  L.x = lerp(L.sx, PX + 10, u);
  L.y = lerp(L.sy, FEET_Y - 20, u) - Math.sin(Math.PI * u) * 34;
  if (u >= 1) {
    const f = L.fish;
    const st = Math.pow(Math.random(), 1.6);
    const size = Math.round(lerp(f.size[0], f.size[1], st));
    let pts = f.pts * (0.8 + 0.5 * st) * (L.perfect ? 1.5 : 1);
    pts = Math.max(5, Math.round(pts / 5) * 5);
    G.score += pts;
    G.catches++;
    G.card = { fish: f, size, pts, perfect: L.perfect, t: 0 };
    G.state = 'card';
    G.land = null;
    G.mg = null;
    if (f.tier >= 3) { SFX.legend(); sparks(160, 60, 26, 70, TIERS[f.tier].color); }
    else SFX.catch();
  }
}
function updateReelIn() {
  const r = G.reel, b = G.bob;

function startSleep(kind) {

function tickClock() {

  G.min += 10 / 180;   // 10 in-game minutes every 3 seconds
  if (G.min >= 26 * 60) { G.min = 26 * 60; startSleep('late'); }
}

function stateUpdate(p) {
  const b = G.bob;
  switch (G.state) {
    case 'idle':
      if (p) { G.state = 'charging'; G.power = 0; G.pdir = 1; }
      break;
    case 'charging':
      G.power += G.pdir * 0.02;
      if (G.power >= 1) { G.power = 1; G.pdir = -1; } else if (G.power <= 0) { G.power = 0; G.pdir = 1; }
      if (!input.held) doCast();
      break;
    case 'casting': {
      b.t++;
      const u = Math.min(1, b.t / b.dur);
      b.x = lerp(b.sx, b.tx, u);
      b.y = lerp(b.sy, b.ty, u) - Math.sin(Math.PI * u) * 30;
      if (u >= 1) land();
      break;
    }
    case 'waiting':
      if (p) { reelIn(G.t - G.lastNib < 25 ? 'TOO EARLY! THAT WAS JUST A NIBBLE.' : null); break; }
      b.dip *= 0.85;
      if (--G.nibT <= 0 && G.biteT > 50) {
        G.nibT = randi(40, 130); b.dip = 2; G.lastNib = G.t;
        ripple(b.x, b.y, 5); SFX.nibble();
        if (Math.random() < 0.4) hop(1.1);
      }
      if (G.t % 80 === 0) ripple(b.x, b.y, 6);
      if (--G.biteT <= 0) startBite();
      break;
    case 'bite':
      if (p) { hook(); break; }
      if (G.t % 6 === 0) splash(b.x, b.y, 2, 0.6);
      if (--G.biteWin <= 0) {
        setMsg('TOO SLOW... IT GOT AWAY.', '#ffb0a0', 120);
        dogReact('miss'); SFX.miss();
        reelIn();
      }
      break;
    case 'minigame': updateMG(); break;
    case 'landing': updateLanding(); break;
    case 'card':
      G.card.t++;
      if (G.card.fish.tier >= 3 && G.card.t % 10 === 0) sparks(160, 62, 2, 60, TIERS[G.card.fish.tier].color);
      if (p && G.card.t > 25) { G.card = null; G.state = 'idle'; SFX.click(); }
      break;
    case 'reelin': updateReelIn(); break;
    case 'sleep': updateSleep(); break;
  }
}

// ---------------------------------------------------------------- rod geometry
function rodTarget() {
  switch (G.state) {
    case 'charging': return { a: lerp(-1.3, -2.5, G.power), hx: -1, hy: -16, ten: 0 };
    case 'casting':  return { a: -0.45, hx: 7, hy: -13, ten: 0 };
    case 'waiting':  return { a: -0.6, hx: 6, hy: -12, ten: 0.05 };
    case 'bite':     return { a: -0.5, hx: 6, hy: -12, ten: 0.7 };
    case 'minigame': return { a: -0.95, hx: 6, hy: -14, ten: 0.55 + 0.25 * Math.sin(G.t * 0.3) };
    case 'landing':  return { a: -1.35, hx: 5, hy: -15, ten: 0.2 };
    case 'reelin':   return { a: -0.9, hx: 6, hy: -13, ten: 0 };
    default:         return { a: -1.15, hx: 5, hy: -12, ten: 0 };
  }
}
function updateRod() {
  const t = rodTarget(), r = G.rod;
  const k = G.state === 'casting' ? 0.45 : 0.22;
  r.a += (t.a - r.a) * k;
  r.hx += (t.hx - r.hx) * k;
  r.hy += (t.hy - r.hy) * k;
  r.ten += (t.ten - r.ten) * 0.25;
  let jx = 0, jy = 0;
  if (G.state === 'minigame' && G.mg && G.mg.t % 4 < 2 && Math.abs(G.mg.speed) > 1.5) jx = 1;
  if (G.state === 'bite' && G.t % 4 < 2) jy = 1;
  const hx = Math.round(PX + r.hx + jx), hy = Math.round(FEET_Y + r.hy + jy);
  const dx = Math.cos(r.a), dy = Math.sin(r.a);
  let tx = hx + dx * ROD_LEN, ty = hy + dy * ROD_LEN;
  const tgt = G.land ? { x: G.land.x, y: G.land.y } : G.bob;
  if (r.ten > 0.01 && (G.bob.vis || G.land)) {
    const vx = tgt.x - tx, vy = tgt.y - ty, l = Math.hypot(vx, vy) || 1;
    tx += vx / l * r.ten * 7;

// ---------------------------------------------------------------- ambient life
function ambient() {

  if (hr > 7 && hr < 18.5 && --G.birdT <= 0) {
    G.birdT = randi(400, 1100);
    const n = randi(1, 4), y = randi(14, 40);
    for (let i = 0; i < n; i++) birds.push({ x: -10 - i * 9, y: y + (i % 2) * 4 + randi(-1, 2), sp: rand(0.35, 0.55), ph: randi(0, 20) });
  }
  for (let i = birds.length - 1; i >= 0; i--) { birds[i].x += birds[i].sp; if (birds[i].x > W + 10) birds.splice(i, 1); }
  if (--G.jumpT <= 0) {
    G.jumpT = randi(360, 1100);
    if (G.state !== 'minigame' && G.state !== 'title') jumps.push({ x: randi(150, 300), y: randi(92, 165), t: 0, dur: 36, dir: Math.random() < 0.5 ? -1 : 1 });
  }
  for (let i = jumps.length - 1; i >= 0; i--) {
    const j = jumps[i];
    if (j.t === 0) { splash(j.x, j.y, 4, 0.7); ripple(j.x, j.y, 7); }
    j.t++;
    if (j.t === j.dur) { splash(j.x + j.dir * 12, j.y, 5, 0.8); ripple(j.x + j.dir * 12, j.y, 8); jumps.splice(i, 1); }
  }
  if (G.t % 40 === 0) part({ type: 'smoke', x: CHIMNEY.x + rand(0, 2), y: CHIMNEY.y, vx: rand(0.03, 0.1), vy: -rand(0.08, 0.14), life: 150, color: '#b4b4bc' });
  for (const f of flies) {
    f.ph += 0.05;
    f.x += Math.sin(f.ph * 0.7 + f.s) * 0.15;
    f.y += Math.cos(f.ph * 0.5 + f.s) * 0.1;
    if (f.x < 0) f.x = 130; if (f.x > 130) f.x = 0;
    f.y = clamp(f.y, 55, 128);
  }
  for (const s of sparkles) { s.x += s.dr; if (s.x < -5) s.x = W; if (s.x > W) s.x = -5; }
  if (G.state !== 'title') {
    if (hr > 6.5 && hr < 18 && Math.random() < 0.0018) SFX.chirp();
    if (isNight() && Math.random() < 0.006) SFX.cricket();
  }
}
function updateParts() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
    if (p.life <= 0 || (p.floor !== undefined && p.vy > 0 && p.y >= p.floor)) parts.splice(i, 1);
  }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].r += 0.22; if (ripples[i].r >= ripples[i].max) ripples.splice(i, 1); }
}

// ---------------------------------------------------------------- main update
function update() {
  G.t++;
  const p = input.pressed;
  input.pressed = false;
  if (G.state === 'title') {
    if (p) { G.state = 'idle'; SFX.click(); setMsg('DAY 1 - A PERFECT MORNING FOR FISHING!', '#fff4c0', 170); }
  } else if (G.help) {
    if (p) G.help = false;

}

  const x = Math.round(cx - w / 2), y = Math.round(FEET_Y - 31 + dog.y);
  ctx.fillStyle = '#2a1a12';
  ctx.fillRect(x - 1, y, w + 2, h); ctx.fillRect(x, y - 1, w, h + 2);
  ctx.fillRect(cx - 2, y + h, 5, 2); ctx.fillRect(cx - 1, y + h + 2, 3, 1);
  ctx.fillStyle = '#fffaf0';
  ctx.fillRect(x, y, w, h);
  ctx.fillRect(cx - 1, y + h, 3, 1); ctx.fillRect(cx, y + h + 1, 1, 1);
  if (heart) ctx.drawImage(SPR.heart, x + 2, y + 1);
  else text(b.text, x + 3, y + 2, '#3a2414');
}
function drawMG() {
  const m = G.mg;
  if (!m) return;
  const f = m.fish, tier = TIERS[f.tier];
  const fx = 10, fy = 14, tx = fx + 4, ty = fy + 5, tw = 14, th = 142, mx = fx + 21;
  let sx = 0;
  if (m.progress < 0.15 && m.delay <= 0 && (G.t >> 1) % 2) sx = 1;
  // frame
  ctx.fillStyle = '#24140a'; ctx.fillRect(fx - 1 + sx, fy - 1, 32, 154);
  ctx.fillStyle = '#b07840'; ctx.fillRect(fx + sx, fy, 30, 152);
  ctx.fillStyle = '#d8a464'; ctx.fillRect(fx + 1 + sx, fy + 1, 28, 1); ctx.fillRect(fx + 1 + sx, fy + 1, 1, 150);
  ctx.fillStyle = '#7a4e24'; ctx.fillRect(fx + 1 + sx, fy + 150, 28, 1); ctx.fillRect(fx + 28 + sx, fy + 1, 1, 150);
  // track (water)
  const X = tx + sx;
  ctx.fillStyle = '#24140a'; ctx.fillRect(X - 1, ty - 1, tw + 2, th + 2);
  ctx.fillStyle = '#2e62a4'; ctx.fillRect(X, ty, tw, th);
  ctx.fillStyle = '#244e88'; ctx.fillRect(X, ty + 71, tw, 71);
  checker(ctx, X, ty + 69, tw, 2, '#244e88');
  ctx.fillStyle = '#1c3e70'; ctx.fillRect(X, ty + 120, tw, 22);
  checker(ctx, X, ty + 118, tw, 2, '#1c3e70');
  ctx.fillStyle = '#7ab0e8';
  for (let i = 0; i < 6; i++) {
    const by = ty + th - 1 - ((m.t * 0.4 + i * 27) % th);
    ctx.fillRect(X + 2 + ((i * 5) % 10), Math.round(by), 1, 1);
  }
  // green bar
  const by = ty + Math.round(m.barPos / 4), bh = Math.round(m.barH / 4);
  ctx.fillStyle = m.inBar ? '#7ae25e' : '#4ea442'; ctx.fillRect(X, by, tw, bh);
  ctx.fillStyle = m.inBar ? '#c4ff9e' : '#7ccc6a'; ctx.fillRect(X, by, tw, 1); ctx.fillRect(X, by, 1, bh);
  ctx.fillStyle = '#2e7a2a'; ctx.fillRect(X, by + bh - 1, tw, 1); ctx.fillRect(X + tw - 1, by, 1, bh);
  // fish icon
  const jx = m.inBar && m.delay <= 0 ? randi(-1, 2) : 0;
  const iy = ty + Math.round((m.pos + 16) / 4) - 1;
  ctx.drawImage(ICONS[f.tier], X + 1 + jx, iy);
  if (f.tier === 4 && (G.t >> 3) % 2) { ctx.fillStyle = '#fff8c0'; ctx.fillRect(X + 3 + jx, iy + 1, 1, 1); }
  // catch meter
  ctx.fillStyle = '#24140a'; ctx.fillRect(mx - 1 + sx, ty - 1, 7, th + 2);
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(mx + sx, ty, 5, th);
  const ph = Math.round(m.progress * th);
  ctx.fillStyle = m.progress < 0.33 ? '#e84a3a' : m.progress < 0.66 ? '#f0b030' : '#6ee05a';
  ctx.fillRect(mx + sx, ty + th - ph, 5, ph);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(mx + sx, ty + th - ph, 1, ph);
  // difficulty label
  text(tier.name, fx, fy - 9, tier.color, 1, '#140c08');
  for (let i = 0; i < tier.stars; i++) ctx.drawImage(SPR.star, fx + textW(tier.name) + 3 + i * 6, fy - 10);
  // HIT!
  if (m.delay > 0) textC('HIT!', G.bob.x, G.bob.y - 26 - ((m.delay >> 2) % 2), '#fff060', 2, '#3a1a08');
}
function drawCard() {
  const c = G.card;
  if (!c) return;
  const f = c.fish, tier = TIERS[f.tier], spr = FSPR[f.idx];
  const w = 172, h = 128, x = Math.round((W - w) / 2), y = 22 - Math.max(0, 12 - c.t);
  ctx.fillStyle = 'rgba(10,6,16,0.35)'; ctx.fillRect(0, 0, W, 171);
  woodBox(x, y, w, h);
  textC('YOU CAUGHT A FISH!', x + w / 2, y + 6, '#8a5a2a');
  // sprite with rays
  const scx = x + w / 2, scy = y + 38;
  ctx.globalAlpha = 0.35;
  for (let i = 0; i < 12; i++) {
    const an = i / 12 * Math.PI * 2 + G.t * 0.01;
    line(ctx, scx + Math.cos(an) * 8, scy + Math.sin(an) * 6, scx + Math.cos(an) * 46, scy + Math.sin(an) * 24, tier.color);
  }
  ctx.globalAlpha = 1;
  const sc = Math.max(1, Math.min(3, Math.floor(120 / spr.width), Math.floor(46 / spr.height)));
  const sw = spr.width * sc, sh = spr.height * sc;
  ctx.drawImage(spr, Math.round(scx - sw / 2), Math.round(scy - sh / 2 + Math.sin(c.t * 0.08) * 1.5), sw, sh);
  // name & difficulty
  textC(f.name, scx, y + 65, '#3a1e0c', 2);
  const label = tier.name;
  const tw2 = tier.stars * 6 + 3 + textW(label);
  let lx = Math.round(scx - tw2 / 2);
  for (let i = 0; i < tier.stars; i++) ctx.drawImage(SPR.star, lx + i * 6, y + 78);
  ctx.fillStyle = '#3a1e0c';
  text(label, lx + tier.stars * 6 + 3, y + 80, f.tier === 4 ? '#c08000' : f.tier === 3 ? '#8a40c0' : f.tier === 2 ? '#c05a10' : f.tier === 1 ? '#a08000' : '#3a8a30');
  textC('SIZE: ' + c.size + ' CM     +' + c.pts + ' PTS', scx, y + 90, '#5a3418');
  textC('BITES: ' + timeRange(f), scx, y + 99, '#8a6a48');
  if (c.perfect) textC('PERFECT CATCH!  X1.5 POINTS', scx, y + 108, (G.t >> 3) % 2 ? '#d04020' : '#f08020');
  if (c.t > 25 && (G.t >> 4) % 2) textC('PRESS SPACE / CLICK', scx, y + 118, '#7a5a3a');
}
function drawTitle() {
  ctx.fillStyle = 'rgba(14,10,24,0.55)';
  ctx.fillRect(0, 0, W, H);
  const x = 34, y = 14, w = 252, h = 152;
  woodBox(x, y, w, h);
  textC('LAKESIDE ANGLER', 160, y + 8, '#c86a20', 2, '#3a1e0c');
  textC('A COZY 8-BIT FISHING GAME', 160, y + 22, '#8a5a2a');
  const lines = [
    ['HOLD SPACE OR MOUSE TO CHARGE YOUR CAST,', '#4a2a12'],
    ['RELEASE TO THROW. FARTHER = DEEPER = RARER FISH.', '#4a2a12'],
    ['WHEN THE ! APPEARS, PRESS QUICKLY TO HOOK IT.', '#4a2a12'],
    ['REELING: HOLD TO RAISE THE GREEN BAR, LET GO TO', '#4a2a12'],
    ['DROP IT. KEEP THE FISH INSIDE TO FILL THE METER!', '#4a2a12'],
    ['', ''],
    ['EXTRA MECHANIC: DAY AND NIGHT CYCLE', '#2a6a9a'],
    ['EACH FISH BITES AT CERTAIN HOURS - RARE FISH', '#2a6a9a'],
    ['ONLY COME OUT LATE AT NIGHT. DAY ENDS AT 2AM.', '#2a6a9a'],
    ['', ''],
    ['N: NAP 2H   P: PET DOG   H: HELP   M: MUTE', '#7a4a20'],
  ];
  lines.forEach(([s, c], i) => { if (s) textC(s, 160, y + 32 + i * 8, c); });
  if ((G.t >> 4) % 2) textC('PRESS SPACE OR CLICK TO START', 160, y + 141, '#c83a20');
  // little fish parade
  [0, 3, 5, 8, 10].forEach((fi, i) => {
    const s = FSPR[fi];
    ctx.drawImage(s, Math.round(x + 18 + i * 48 - s.width / 2 + Math.sin(G.t * 0.05 + i) * 2), y + 135 - s.height);
  });
}
function drawHelp() {
  ctx.fillStyle = 'rgba(14,10,24,0.55)';
  ctx.fillRect(0, 0, W, 171);
  const x = 14, y = 6, w = 292, h = 162;
  woodBox(x, y, w, h);
  textC('HOW TO PLAY', 160, y + 6, '#3a1e0c', 2);
  const L = [
    'SPACE/MOUSE: HOLD + RELEASE TO CAST, PRESS ON ! TO HOOK,',
    'HOLD TO RAISE THE BAR WHILE REELING, RELEASE TO DROP IT.',
    'N: NAP 2 HOURS   P: PET THE DOG   M: SOUND   H: CLOSE',
  ];
  L.forEach((s, i) => textC(s, 160, y + 20 + i * 8, '#4a2a12'));
  textC('FISH GUIDE  (CAST FARTHER FOR HARDER FISH)', 160, y + 47, '#2a6a9a');
  FISH.forEach((f, i) => {
    const ry = y + 57 + i * 8;
    const t = TIERS[f.tier];
    text(f.name, x + 14, ry, '#3a1e0c');
    text(t.name, x + 112, ry, f.tier === 4 ? '#c08000' : f.tier === 3 ? '#8a40c0' : f.tier === 2 ? '#c05a10' : f.tier === 1 ? '#a08000' : '#3a8a30');
    text(timeRange(f), x + 172, ry, '#5a3418');
  });
  textC('THE DAY ENDS AT 2AM - THEN A NEW DAY BEGINS AT 6AM.', 160, y + 148, '#8a5a2a');
}
function drawFade() {
  const s = G.sleep;
  const a = s.t < 70 ? s.t / 70 : (140 - s.t) / 70;
  ctx.fillStyle = `rgba(6,4,14,${clamp(a, 0, 1)})`;
  ctx.fillRect(0, 0, W, H);
  if (s.t > 40 && s.t < 100) {
    ctx.globalAlpha = clamp(1 - Math.abs(s.t - 70) / 30, 0, 1);
    textC(s.kind === 'nap' ? 'Z Z Z . . .' : "IT'S 2AM... TIME FOR BED.", 160, 80, '#e0e8ff', s.kind === 'nap' ? 2 : 1);
    if (s.kind !== 'nap') textC('Z Z Z', 160, 92, '#a0a8d0', 2);
    ctx.globalAlpha = 1;
  }
}
function drawUI() {
  if (G.state === 'title') { drawTitle(); return; }
  drawDogBubble();
  if (G.state === 'bite') drawExclaim();
  if (G.state === 'charging') drawPower();
  if (G.state === 'minigame') drawMG();
  drawHUD();
  drawMsg();
  drawStrip();
  if (G.state === 'card') drawCard();
  drawParts(ctx, true);
  if (G.help) drawHelp();
  if (G.state === 'sleep') drawFade();
}

function render() {
  const hr = hour();
  const sk = keyInterp(SKY_KEYS, hr), tint = keyInterp(TINT_KEYS, hr);
  drawSky(sk.slice(0, 3), sk.slice(3, 6));
  drawStars(hr < 7 ? clamp((7 - hr) * 0.7, 0, 1) : clamp((hr - 19.4) / 1.4, 0, 1));
  const sp = sunPos(hr), mp = moonPos(hr);
  if (sp) drawSun(sp, hr);
  if (mp) drawMoon(mp);

  // world layer
  wg.clearRect(0, 0, W, H);
  for (const c of clouds) wg.drawImage(c.spr, Math.round(c.x), c.y);
  drawBirds();
  wg.drawImage(bgC, 0, 0);
  wg.drawImage(waterC, 0, WATER_Y);
  drawWaterFx(sp, hr);
  wg.drawImage(fgC, 0, 0);
  drawBobber();
  drawDog(wg);
  drawPlayer(wg);
  drawLine(wg);
  drawLanding(wg);
  drawParts(wg, false);
  if (tint[0] < 254 || tint[1] < 254 || tint[2] < 254) applyTint(tint);
  const sx = G.shake > 0 ? randi(-1, 2) : 0, sy = G.shake > 0 ? randi(-1, 2) : 0;
  ctx.drawImage(wC, sx, sy);

  const na = hr >= 19 ? clamp((hr - 19.3) / 1.4, 0, 1) : hr < 7 ? clamp((7 - hr) * 0.8, 0, 1) * 0.8 : 0;
  if (na > 0) drawNight(na, mp);
  drawUI();
}

// ---------------------------------------------------------------- loop
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
updateRod();
function frame(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
})();
</script>
</body>
</html>
